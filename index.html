<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Favicon Link -->
  <link rel="icon" type="image/png" href="./favicon-32x32.png" />
  
  <title>HI LOL</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- SCREEN 1: MAIN PROPOSAL -->
  <div class="card screen active" id="screen1">
    <div class="gif-container">
      <img id="gif1" src="./idolo.gif" onerror="this.src='https://c.tenor.com/rPAM20SrLsAAAAAC/picoozi-cute-cat.gif';" alt="Shy Cute Cat" />
    </div>
    <h1>wanna go out?</h1>
    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">YES✦</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
    <div class="sub-text" id="subText"></div>
  </div>

  <!-- SCREEN 2: YAY! -->
  <div class="card screen" id="screen2">
    <div class="gif-container">
      <img src="./image.gif" onerror="this.src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p4Zml5Y3M1Nm8xd3V3aHowbm5mMjZ4bTRuY2RybmdmcmxuaDFyZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/KztT2c4u8mYYUiMKdJ/giphy.gif';" alt="Happy Cats" />
    </div>
    <h1>YAY!</h1>
    <p class="subtitle">I'm so glad u said yes.</p>
    <button class="btn btn-action" id="toScreen3Btn">PRESS TO CONTINUE →</button>
  </div>

  <!-- SCREEN 3: PICK A DATE -->
  <div class="card screen" id="screen3">
    <div class="gif-container">
      <img src="./idolo.gif" onerror="this.src='https://c.tenor.com/rPAM20SrLsAAAAAC/picoozi-cute-cat.gif';" alt="Cute Cat Thinking" />
    </div>
    <h1>PICK A DATE</h1>
    <p class="subtitle">Choose the day for our cute little plan.</p>
    <input type="date" id="datePicker" class="pixel-input" />
    <button class="btn btn-action" id="toScreen4Btn">CONTINUE →</button>
  </div>

  <!-- SCREEN 4: WHAT WOULD YOU LIKE TO DO? -->
  <div class="card screen" id="screen4">
    <div class="gif-container">
      <img src="./image.gif" onerror="this.src='https://c.tenor.com/rPAM20SrLsAAAAAC/picoozi-cute-cat.gif';" alt="Cute Cat Options" />
    </div>
    <h1>WHAT WOULD YOU LIKE TO DO?</h1>
    <div class="options-grid">
      <button class="option-btn" data-val="LUNCH">LUNCH</button>
      <button class="option-btn" data-val="DINNER">DINNER</button>
      <button class="option-btn" data-val="COFFEE">COFFEE</button>
      <button class="option-btn" data-val="SURPRISE ME">SURPRISE ME</button>
    </div>
    <button class="btn btn-lock" id="lockBtn">LOCK IT IN 🔒</button>
  </div>

  <!-- SCREEN 5: FINAL CONFIRMATION -->
  <div class="card screen" id="screen5">
    <div class="gif-container">
      <img src="./image.gif" onerror="this.src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p4Zml5Y3M1Nm8xd3V3aHowbm5mMjZ4bTRuY2RybmdmcmxuaDFyZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/KztT2c4u8mYYUiMKdJ/giphy.gif';" alt="Celebration" />
    </div>
    <h1>IT'S A PLAN! 💕</h1>
    <div class="summary-box">
      <p id="summaryDate">Date: -</p>
      <p id="summaryActivity">Activity: -</p>
    </div>
    <p class="subtitle">screenshot and send to the sender :D</p>
  </div>

  <!-- SCREEN 6: REJECTED / GHOST ENDING -->
  <div class="card screen" id="screen6">
    <div class="gif-container">
      <img src="./idolo.gif" onerror="this.src='https://c.tenor.com/rPAM20SrLsAAAAAC/picoozi-cute-cat.gif';" alt="Sad Cat" />
    </div>
    <h1>ghost the sender 👻</h1>
  </div>

  <script src="./script.js"></script>
</body>
</html>
