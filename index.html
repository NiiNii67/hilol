<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you go out with me?</title>
  <!-- Pixel Art Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating background decorations -->
  <div class="bg-heart" style="top: 10%; left: 10%;">♥</div>
  <div class="bg-heart" style="top: 20%; right: 12%; animation-delay: 1s;">♥</div>
  <div class="bg-heart" style="bottom: 15%; left: 15%; animation-delay: 2s;">♥</div>
  <div class="bg-heart" style="bottom: 10%; right: 10%; animation-delay: 1.5s;">♥</div>

  <div class="card" id="card">
    <div class="gif-container">
      <img id="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Y1bGtqNWx4cG44YjJ0bnRwNDdneWRxNmN6a3R6ZjJpNmNxbmd5biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1d9wEBpw355A3Aa/giphy.gif" alt="Cute Cat" />
    </div>

    <h1 id="question">Will you go out with me?</h1>

    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">YES✦</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>

    <div class="sub-text" id="subText"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
